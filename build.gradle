plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-neoforge-1.21.1" }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server() }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            // NeoForge 1.21.1 运行时就是 Mojang official 名字，refmap 里的 SRG 值反而解析不到，
            // 所以开发环境直接按注解里的字面名字解析。
            systemProperty 'mixin.env.disableRefMap', 'true'
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven { name = 'NeoForge'; url = 'https://maven.neoforged.net/releases/' }
    // Confluence 官方 Maven
    maven { name = 'Confluence'; url = 'https://maven.confluence.ink/releases' }
    // 第三方模组默认走 CurseForge Maven
    maven { name = 'CurseMaven'; url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
    maven { name = 'Curios'; url = 'https://maven.theillusivec4.top/' }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex 'software\\.bernie.*'
            includeGroup 'com.eliotlash.mclib'
        }
    }
}

// ---------------------------------------------------------------------------
// 兄弟项目依赖：QShop / 出售箱都没有发布到 Maven，只能引用本地构建产物。
// NeoForge 1.21.1 的模组 jar 用的就是 official 名字，不需要 deobf，直接 files() 即可。
// ---------------------------------------------------------------------------
def siblingJar = { String propertyName ->
    def raw = findProperty(propertyName)
    if (raw == null || raw.toString().isBlank()) {
        throw new GradleException("gradle.properties 缺少 ${propertyName}")
    }
    def source = file(raw.toString())
    if (!source.isFile()) {
        throw new GradleException("未找到依赖 jar（${propertyName}）: ${source}\n" +
                "请先构建对应项目，或用 -P${propertyName}=<path> 指定。")
    }
    return source
}

def qshopJarFile = siblingJar('qshop_jar')
def sellboxJarFile = siblingJar('sellbox_jar')

dependencies {
    // QShop 是硬依赖；出售箱与 Confluence 运行时可缺，但编译期需要它们的类。
    compileOnly files(qshopJarFile)
    compileOnly files(sellboxJarFile)
    compileOnly findProperty('confluence_jar')

    // 开发环境冒烟测试用的运行时依赖（Confluence 本体 + 它要求的前置）。
    // 默认关闭以保持普通 build 轻量；跑冒烟测试时加 -Pwith_confluence_runtime=true。
    if (findProperty('with_confluence_runtime') == 'true') {
        runtimeOnly files(qshopJarFile)
        runtimeOnly files(sellboxJarFile)
        runtimeOnly findProperty('confluence_jar')
        runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
        runtimeOnly "software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_version}"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    inputs.properties([
            mod_id         : mod_id,
            mod_name       : mod_name,
            mod_version    : mod_version,
            mod_license    : mod_license,
            mod_authors    : mod_authors,
            mod_description: mod_description,
            neo_version_range   : neo_version_range,
            minecraft_version_range: minecraft_version_range,
            loader_version_range: loader_version_range,
    ])
    filesMatching('META-INF/neoforge.mods.toml') { expand inputs.properties }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_authors,
                'MixinConfigs'          : "${mod_id}.mixins.json",
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) { from components.java }
    }
}
