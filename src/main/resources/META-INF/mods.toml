modLoader = "javafml"
loaderVersion = "[47,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[47.4.20,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.21)"
ordering = "NONE"
side = "BOTH"

# QShop 是硬依赖：本模组的工作方式就是接管 QShop 的钱包入口。
[[dependencies.${mod_id}]]
modId = "qshop"
mandatory = true
versionRange = "[1.8.0,)"
ordering = "AFTER"
side = "BOTH"

# Confluence 与出售箱按可选处理：缺失时对应功能自动关闭，不会启动崩溃。
[[dependencies.${mod_id}]]
modId = "confluence"
mandatory = false
versionRange = "[1.2.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "qshop_sellbox"
mandatory = false
versionRange = "[1.5.0,)"
ordering = "AFTER"
side = "BOTH"
